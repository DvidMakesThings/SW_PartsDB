; Copy to config.local.ini on EACH machine; the local file is gitignored.
; Relative paths resolve beside that INI file, not the shell working directory.
; Do not quote paths. Forward slashes work on Windows too.
; Environment variables override these settings.
[paths]
database = dmtdb.sqlite
library_repo = ../LIB_KiCad-Libraries
library_cache = instance/library-cache
artifacts = instance/artifacts
backups = instance/backups
datasheets = datasheets
part_images = part_images
kicad_libs = kicad_libs
staging = _staging
; Optional: schema, templates, csv_seed, kicad_symbols,
; kicad_footprints, kicad_3dmodels. Empty csv_seed disables automatic seeding.

[server]
host = 0.0.0.0
port = 5000
debug = false
artifact_max_bytes = 104857600
public_url = http://192.168.0.25:5000
; For an isolated snapshot preview only:
; read_only_preview = true
; preview_production_url = http://192.168.0.25:5000
; Set secret here or via DMTDB_SECRET; never commit a real secret.

; Optional [database] url overrides paths.database (e.g. PostgreSQL).
; Optional [supply] cache_ttl and usd_to_eur preserve existing env overrides.
