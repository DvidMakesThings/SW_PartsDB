<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="50mm"
     viewBox="0 0 100 50" font-family="Helvetica, Arial, sans-serif">
  <style>
    .card  { fill:#ffffff; stroke:#000000; stroke-width:0.6; }
    .bar   { fill:#111111; }
    .code  { fill:#ffffff; font-size:11px; font-weight:bold; letter-spacing:0.5px; }
    .title { fill:#000000; font-size:15px; font-weight:bold; }
    .items { fill:#222222; font-size:5px; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="99" height="49" rx="3"/>
  <rect class="bar"  x="0.5" y="0.5" width="99" height="16" rx="3"/>
  <rect class="bar"  x="0.5" y="8"   width="99" height="8.5"/>
  <text class="code"  x="5"  y="11.5">BX01-R</text>
  <text class="title" x="5"  y="30">Resistors</text>
  <text class="items" x="5"  y="39">Resistors, resistor arrays / networks,</text>
  <text class="items" x="5"  y="45.5">potentiometers, trimmers</text>
</svg>
